<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BRAIN - Interactive Learning Hub</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <div class="brand"><span class="brand-mark">◉</span><span class="brand-name">THE BRAIN</span></div>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search lessons, terms, structures..." aria-label="Search">
    </div>
    <div class="streak" id="streakBox" title="Learning streak">🔥 <span id="streakCount">0</span></div>
  </header>
  <nav id="sidenav" aria-label="Main navigation">
    <div class="nav-item" data-route="dashboard"><span>🏠</span> Dashboard</div>
    <div class="nav-item" data-route="library"><span>📚</span> Learning Library</div>
    <div class="nav-item" data-route="explorer"><span>🧠</span> Brain Explorer</div>
    <div class="nav-item" data-route="lab"><span>🔬</span> Laboratory</div>
    <div class="nav-item" data-route="visuals"><span>📊</span> Visual Library</div>
    <div class="nav-item" data-route="practice"><span>✍️</span> Practice Centre</div>
    <div class="nav-item" data-route="flashcards"><span>🃏</span> Flashcards</div>
    <div class="nav-item" data-route="glossary"><span>📖</span> Glossary</div>
    <div class="nav-item" data-route="progress"><span>📈</span> My Progress</div>
    <div class="nav-note">Content source: <em>Understanding The Brain</em>, Future PLC (100 pp)</div>
  </nav>
  <div id="overlay"></div>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
